# Development use: `alembic revision --autogenerate -m "..."` and `alembic upgrade head` from a
# checkout. The application migrates through payload_cache.db.migrate, which builds this
# configuration in code, and env.py takes the database URL from the service settings
# (DATABASE_URL), so there is no sqlalchemy.url here to fall out of step with it.
[alembic]
script_location = src/payload_cache/db/migrations
# Slug first so the module name never starts with a digit (the hash of an autogenerated
# revision may), which keeps the scripts importable and lint-clean.
file_template = %%(slug)s_%%(rev)s
