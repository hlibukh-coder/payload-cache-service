[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "payload-cache-service"
version = "0.1.0"
description = "FastAPI microservice that builds payloads from two string lists and caches the results of a (simulated) external transformer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # First release whose Starlette pin has no upper bound; earlier ones cap Starlette below
    # what main.py imports.
    "fastapi>=0.134",
    # RequestBodyLimitMiddleware ships from 1.6 (and the TestClient has been an httpx2.Client
    # since 1.2). FastAPI itself only guarantees >=0.46, so the floor the app needs is stated.
    "starlette>=1.6",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    # Schema migrations; 1.13 is the first release typed for SQLAlchemy 2.0.
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.10",
    # httpx's successor. Starlette's TestClient is built on it, so cache-cli and the tests
    # share one HTTP client and one set of exception types.
    "httpx2>=2.0",
    # Official client; 0.20 is the first release whose exposition helpers are typed.
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
cache-cli = "payload_cache.cli:main"
payload-cache-migrate = "payload_cache.schema:main"

[tool.hatch.build.targets.wheel]
packages = ["src/payload_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
