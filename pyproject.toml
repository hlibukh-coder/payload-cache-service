[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "payload-cache-service"
version = "0.1.0"
description = "FastAPI microservice that builds payloads from two string lists and caches the results of a (simulated) external transformer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
cache-cli = "payload_cache.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/payload_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
