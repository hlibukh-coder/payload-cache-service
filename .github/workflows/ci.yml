# The checks the README asks a developer to run locally, on every push to main and every pull
# request, on both database backends, plus a smoke test of the Docker image so that the
# deployable artefact is exercised, not only the source tree.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The postgres extra is installed so mypy sees the driver the PostgreSQL tests import.
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test-sqlite:
    name: Tests on SQLite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest interpreter pyproject.toml admits and the one the Docker image ships.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  test-postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,postgres]"
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://payload:payload@localhost:5432/payload

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag payload-cache:ci .
      - name: Start the container and wait for /health
        run: |
          docker run --detach --name api --publish 8000:8000 payload-cache:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Exercise the service with cache-cli from inside the image
        run: |
          docker exec api cache-cli -r 2 -j '{"list_1": ["first string"], "list_2": ["other string"]}' | tee report.json
          python3 - <<'PY'
          import json

          with open("report.json") as file:
              report = json.load(file)
          assert report["output"] == "FIRST STRING, OTHER STRING", report
          assert [run["status"] for run in report["runs"]] == [201, 200], report
          assert report["consistent"], report
          PY
